name: Sync upstream

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: sync-upstream-main
  cancel-in-progress: true

jobs:
  merge:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      SYNC_BRANCH: automation/sync-upstream-main
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Create or update upstream sync PR
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/missuo/kumone.git
          git fetch origin main
          git fetch upstream main

          if git merge-base --is-ancestor upstream/main origin/main; then
            echo "Fork main already contains upstream main."
            exit 0
          fi

          git switch -C "$SYNC_BRANCH" origin/main
          if ! git merge --no-edit --no-ff upstream/main; then
            echo "::error::Upstream changes conflict with the fork. The sync PR was not updated."
            git merge --abort || true
            exit 1
          fi

          git push --force-with-lease origin "$SYNC_BRANCH"

          UPSTREAM_SHA="$(git rev-parse --short upstream/main)"
          PR_NUMBER="$(gh pr list --repo "$GITHUB_REPOSITORY" --state open \
            --head "$SYNC_BRANCH" --json number --jq '.[0].number')"
          if [[ -n "$PR_NUMBER" ]]; then
            echo "Updated upstream sync PR #$PR_NUMBER to $UPSTREAM_SHA."
          else
            gh pr create \
              --repo "$GITHUB_REPOSITORY" \
              --base main \
              --head "$SYNC_BRANCH" \
              --title "Sync upstream main ($UPSTREAM_SHA)" \
              --body "Merges missuo/kumone main at $UPSTREAM_SHA into the fork. CI must pass before this PR is merged."
          fi
