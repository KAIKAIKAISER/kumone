name: Publish iOS fork release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Fork release tag (for example v0.3.29-ios.1)"
        required: true
        type: string
      marketing_version:
        description: "CFBundleShortVersionString"
        required: true
        default: "0.3.38"
        type: string

permissions:
  contents: write

concurrency:
  group: publish-ios-fork-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: xcode-27
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      VERSION: ${{ inputs.marketing_version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Build unsigned iOS IPA
        run: |
          BUILD_NUMBER="$(git rev-list --count HEAD)"
          SAFE_TAG="${RELEASE_TAG#v}"
          ASSET_NAME="Kumone-iOS-$SAFE_TAG-unsigned.ipa"

          xcodebuild -workspace ios/KumoneIOS.xcworkspace -scheme KumoneIOS \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/ios-dd" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            build

          APP="$RUNNER_TEMP/ios-dd/Build/Products/Release-iphoneos/KumoneIOS.app"
          mkdir -p "$RUNNER_TEMP/ipa/Payload" dist
          cp -R "$APP" "$RUNNER_TEMP/ipa/Payload/"
          ditto -c -k --keepParent "$RUNNER_TEMP/ipa/Payload" "dist/$ASSET_NAME"
          echo "ASSET_NAME=$ASSET_NAME" >> "$GITHUB_ENV"

      - name: Preserve compiled IPA
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET_NAME }}
          path: dist/*.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Publish fork release
        run: |
          NOTES="$RUNNER_TEMP/release-notes.md"
          {
            echo "Unsigned iOS build from commit \`$(git rev-parse --short HEAD)\` (synced with upstream \`v0.3.38\`)."
            echo
            echo "### What's Changed in this Release"
            echo "- 🖼️ **评论生成精美图片卡片分享**：长按评论可自适应封面主色调生成唯美卡片图片并分享/存相册，支持文本复制，去除了卡片底部的微小白边缝隙。"
            echo "- ⏹️ **切歌立即停止上一首**：彻底解决 iOS 切歌时上一首音频继续播放数秒与新歌串音的问题。"
            echo "- ⚙️ **「左滑查看评论」防误触开关**：iOS 设置中新增独立开关，可按需关闭歌词左滑手势，防止日常浏览误触。"
            echo "- 🖥️ **macOS & iPad 歌词/评论切换与一键收藏**：歌词上方提供 Segment 切换；macOS 播放条新增「收藏到歌单」一键按钮。"
            echo "- 🚫 **拦截第三方提示音与错误明示**：自动识别并跳过酷我 11 秒提示音频并尝试下一个音源；播放失败时明示网络错误或服务端返回码。"
            echo "- ⚡ **恢复歌曲歌词秒加载**：杀死重开应用后恢复上次播放歌曲时，立即加载歌词无需等待按播放键。"
            echo "- 🎚️ **iOS 音效与 10 段均衡器**：内置音频 DSP 处理引擎，提供 8 种预设与 10 段图形均衡器调节。"
            echo "- 🎵 **VIP 歌曲播放稳定性增强**：阶梯式音质自适应回退（Hi-Res -> 无损 -> 极高 -> 较高 -> 标准）与瞬时重试机制，消除卡顿断音。"
            echo "- 🚫 **移除检查更新菜单与弹窗**：去除应用内检查更新入口与自动弹窗，纯净离线体验。"
            echo "- 📂 **本地音乐库与锁屏实时歌词**：支持本地歌曲扫描播放，系统锁屏 / 灵动岛 / 播放控制台实时歌词同步滚动与拖拽。"
            echo
            echo "The IPA must be signed before installation (e.g. via TrollStore, AltStore, SideStore, or Apple Developer Certificate)."
          } > "$NOTES"

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "dist/$ASSET_NAME" \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$RELEASE_TAG" "dist/$ASSET_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$(git rev-parse HEAD)" \
              --title "Kumone $RELEASE_TAG (iOS fork)" \
              --notes-file "$NOTES"
          fi
