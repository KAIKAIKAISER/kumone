name: Publish iOS fork release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Fork release tag (for example v0.3.29-ios.1)"
        required: true
        type: string
      marketing_version:
        description: "CFBundleShortVersionString"
        required: true
        default: "0.3.35"
        type: string

permissions:
  contents: write

concurrency:
  group: publish-ios-fork-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: xcode-27
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      VERSION: ${{ inputs.marketing_version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Build unsigned iOS IPA
        run: |
          BUILD_NUMBER="$(git rev-list --count HEAD)"
          SAFE_TAG="${RELEASE_TAG#v}"
          ASSET_NAME="Kumone-iOS-$SAFE_TAG-unsigned.ipa"

          xcodebuild -workspace ios/KumoneIOS.xcworkspace -scheme KumoneIOS \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/ios-dd" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            build

          APP="$RUNNER_TEMP/ios-dd/Build/Products/Release-iphoneos/KumoneIOS.app"
          mkdir -p "$RUNNER_TEMP/ipa/Payload" dist
          cp -R "$APP" "$RUNNER_TEMP/ipa/Payload/"
          ditto -c -k --keepParent "$RUNNER_TEMP/ipa/Payload" "dist/$ASSET_NAME"
          echo "ASSET_NAME=$ASSET_NAME" >> "$GITHUB_ENV"

      - name: Preserve compiled IPA
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET_NAME }}
          path: dist/*.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Publish fork release
        run: |
          NOTES="$RUNNER_TEMP/release-notes.md"
          {
            echo "Unsigned iOS build from commit \`$(git rev-parse --short HEAD)\` (synced with upstream \`v0.3.35\`)."
            echo
            echo "### What's Changed in this Release"
            echo "- 💬 **歌曲评论系统与手势滑动**：iPhone 正在播放界面歌词向左滑动直达歌曲评论（底部双圆点指示），支持滚动加载热门/最新评论与点赞互动，更多菜单亦可直接打开评论。"
            echo "- 🔍 **iOS 全歌单内搜索与云盘增强**：所有歌单均支持歌单内搜索（下拉或点击放大镜），云盘取消 1000 首上限并支持全量搜索与播放。"
            echo "- 🔑 **Cookie 备用登录**：支持在扫码/短信受阻时通过浏览器 Cookie (MUSIC_U) 安全登录。"
            echo "- 🚫 **音乐黑名单与不感兴趣**：支持将单曲/歌手加入黑名单，每日推荐支持「不感兴趣」操作。"
            echo "- 🛠️ **官方音源优先与播放重试**：合入上游网络超时自动重试机制与官方缓存优先策略；修复 iOS 16/17 播放页展开过渡。"
            echo "- 🎚️ **iOS 音效与 10 段均衡器**：内置音频 DSP 处理引擎，提供 8 种预设与 10 段图形均衡器调节。"
            echo "- 🎵 **VIP 歌曲播放稳定性增强**：阶梯式音质自适应回退（Hi-Res -> 无损 -> 极高 -> 较高 -> 标准）与瞬时重试机制，消除卡顿断音。"
            echo "- 🚫 **移除检查更新菜单与弹窗**：去除应用内检查更新入口与自动弹窗，纯净离线体验。"
            echo "- 📂 **本地音乐库与锁屏实时歌词**：支持本地歌曲扫描播放，系统锁屏 / 灵动岛 / 播放控制台实时歌词同步滚动与拖拽。"
            echo
            echo "The IPA must be signed before installation (e.g. via TrollStore, AltStore, SideStore, or Apple Developer Certificate)."
          } > "$NOTES"

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "dist/$ASSET_NAME" \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$RELEASE_TAG" "dist/$ASSET_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$(git rev-parse HEAD)" \
              --title "Kumone $RELEASE_TAG (iOS fork)" \
              --notes-file "$NOTES"
          fi
