name: Publish iOS fork release

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Fork release tag (for example v0.3.29-ios.1)"
        required: true
        type: string
      marketing_version:
        description: "CFBundleShortVersionString"
        required: true
        default: "0.3.29"
        type: string

permissions:
  contents: write

concurrency:
  group: publish-ios-fork-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: xcode-27
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.release_tag }}
      VERSION: ${{ inputs.marketing_version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Build unsigned iOS IPA
        run: |
          BUILD_NUMBER="$(git rev-list --count HEAD)"
          SAFE_TAG="${RELEASE_TAG#v}"
          ASSET_NAME="Kumone-iOS-$SAFE_TAG-unsigned.ipa"

          xcodebuild -workspace ios/KumoneIOS.xcworkspace -scheme KumoneIOS \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/ios-dd" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            MARKETING_VERSION="$VERSION" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            build

          APP="$RUNNER_TEMP/ios-dd/Build/Products/Release-iphoneos/KumoneIOS.app"
          mkdir -p "$RUNNER_TEMP/ipa/Payload" dist
          cp -R "$APP" "$RUNNER_TEMP/ipa/Payload/"
          ditto -c -k --keepParent "$RUNNER_TEMP/ipa/Payload" "dist/$ASSET_NAME"
          echo "ASSET_NAME=$ASSET_NAME" >> "$GITHUB_ENV"

      - name: Preserve compiled IPA
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ASSET_NAME }}
          path: dist/*.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Publish fork release
        run: |
          NOTES="$RUNNER_TEMP/release-notes.md"
          {
            echo "Unsigned iOS build from commit \`$(git rev-parse --short HEAD)\` (synced with upstream \`v0.3.32\`)."
            echo
            echo "### What's Changed in this Release"
            echo "- 🎚️ **iOS 音效与 10 段均衡器**：合入上游最新音频 DSP 引擎，提供原声、低音增强、高音增强、流行、摇滚、人声、古典、电子 8 种音效预设及 10 段图形均衡器调节。"
            echo "- 🎵 **VIP 歌曲播放稳定性增强**：新增阶梯式多音质自适应回退（Hi-Res -> 无损 -> 极高 -> 较高 -> 标准）与瞬时失效自动重试机制，彻底解决 VIP 播放断断续续及并发锁冲突。"
            echo "- 🚫 **移除检查更新菜单与弹窗**：去除应用内检查更新入口与自动弹窗，纯净离线体验。"
            echo "- 📂 **本地音乐库与锁屏实时歌词**：支持 iOS 音乐库本地歌曲扫描播放，系统锁屏 / 灵动岛 / 播放控制台实时歌词同步滚动与进度拖拽同步。"
            echo "- ⚡ **无损与 Hi-Res 下载校验修复**：合入上游针对网易云无损格式的 MD5 与长度校验补丁。"
            echo
            echo "The IPA must be signed before installation (e.g. via TrollStore, AltStore, SideStore, or Apple Developer Certificate)."
          } > "$NOTES"

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "dist/$ASSET_NAME" \
              --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$RELEASE_TAG" "dist/$ASSET_NAME" \
              --repo "$GITHUB_REPOSITORY" \
              --target "$(git rev-parse HEAD)" \
              --title "Kumone $RELEASE_TAG (iOS fork)" \
              --notes-file "$NOTES"
          fi
